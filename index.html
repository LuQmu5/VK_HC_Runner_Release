<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>Hypercasual Runner v.002</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />

    <!-- VK Mini Apps bridge -->
    <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
    <script>
      vkBridge.send('VKWebAppInit');
    </script>

    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #000;
        height: 100%;
        overflow: hidden;
      }

      #unity-container {
        width: 100%;
        height: 100%;
        position: relative;
        background: #231f20;
      }

      canvas {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>

  <body>
    <div id="unity-container">
      <canvas id="unity-canvas"></canvas>
    </div>

    <!-- Unity Loader -->
    <script src="Build/VKRUNNERBUILDWEB.loader.js"></script>
    <script>
      createUnityInstance(document.querySelector("#unity-canvas"), {
        dataUrl: "Build/VKRUNNERBUILDWEB.data",
        frameworkUrl: "Build/VKRUNNERBUILDWEB.framework.js",
        codeUrl: "Build/VKRUNNERBUILDWEB.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Meriada _ Vegma",
        productName: "Hypercasual Runner",
        productVersion: "0.01a"
      });
    </script>

    <!-- Подписка и сообщение -->
    <script>
      function JoinGroupAndSendMessage() {
        const GROUP_ID = 1; // замените на ID вашей группы
        const BONUS_TEXT = "Спасибо за подписку! 🎁";

        vkBridge.send("VKWebAppJoinGroup", { group_id: GROUP_ID })
          .then((res) => {
            if (res.result) {
              console.log("✅ Успешная подписка");

              // Можно отправить сообщение через сервер, если у вас есть токен и backend
              // fetch("https://your-server.com/api/send", { ... })

              alert(BONUS_TEXT); // простой пример бонуса
            } else {
              console.warn("❌ Пользователь отменил подписку");
            }
          })
          .catch((err) => {
            console.error("VKBridge error:", err);
          });
      }
    </script>
  </body>
</html>
